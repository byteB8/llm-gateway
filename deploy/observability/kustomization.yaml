# kubectl apply -k deploy/observability   (after the two Helm charts are installed: it uses their CRDs)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - otel-collector.yaml
  - podmonitors.yaml
  - slo-rules.yaml
  - alert-sink.yaml
configMapGenerator:
  - name: llm-gateway-dashboards
    namespace: observability
    files: [dashboards/llm-gateway.json]
    options:
      labels: {grafana_dashboard: "1"}
      disableNameSuffixHash: true
