# Apps send OTLP to the collector; the collector batches, caps its memory and forwards to Tempo.
# The usual production layout: sampling or extra backends change here, not in every app.
apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector, namespace: observability}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http: {endpoint: "0.0.0.0:4318"}
          grpc: {endpoint: "0.0.0.0:4317"}
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 200}
      batch: {}
    exporters:
      otlp/tempo:
        endpoint: tempo.observability.svc:4317
        tls: {insecure: true}
    service:
      pipelines:
        traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/tempo]}
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector, namespace: observability}
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-http, port: 4318}
    - {name: otlp-grpc, port: 4317}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:0.112.0
          args: ["--config=/conf/config.yaml"]
          ports: [{containerPort: 4318}, {containerPort: 4317}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts: [{name: conf, mountPath: /conf}]
      volumes:
        - name: conf
          configMap: {name: otel-collector}
