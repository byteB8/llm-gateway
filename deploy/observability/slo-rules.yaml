# Generated by scripts/slo_rules.py - edit that, not this file.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llm-gateway-slos
  namespace: observability
spec:
  groups:
  - name: llm-gateway-slo-recording
    interval: 5s
    rules:
    - record: slo:llmgw_availability:error_ratio_rate30s
      expr: ((sum(rate(llmgw_requests_total{code=~"5.."}[30s])) or vector(0)) + (sum(rate(llmgw_stream_interrupted_total{side="backend"}[30s])) or vector(0))) / sum(rate(llmgw_requests_total{code!~"4.."}[30s]))
    - record: slo:llmgw_availability:error_ratio_rate150s
      expr: ((sum(rate(llmgw_requests_total{code=~"5.."}[150s])) or vector(0)) + (sum(rate(llmgw_stream_interrupted_total{side="backend"}[150s])) or vector(0))) / sum(rate(llmgw_requests_total{code!~"4.."}[150s]))
    - record: slo:llmgw_availability:error_ratio_rate5m
      expr: ((sum(rate(llmgw_requests_total{code=~"5.."}[5m])) or vector(0)) + (sum(rate(llmgw_stream_interrupted_total{side="backend"}[5m])) or vector(0))) / sum(rate(llmgw_requests_total{code!~"4.."}[5m]))
    - record: slo:llmgw_availability:error_ratio_rate30m
      expr: ((sum(rate(llmgw_requests_total{code=~"5.."}[30m])) or vector(0)) + (sum(rate(llmgw_stream_interrupted_total{side="backend"}[30m])) or vector(0))) / sum(rate(llmgw_requests_total{code!~"4.."}[30m]))
    - record: slo:llmgw_latency:error_ratio_rate30s
      expr: 1 - sum(rate(llmgw_ttft_seconds_bucket{le="0.5"}[30s])) / sum(rate(llmgw_ttft_seconds_count[30s]))
    - record: slo:llmgw_latency:error_ratio_rate150s
      expr: 1 - sum(rate(llmgw_ttft_seconds_bucket{le="0.5"}[150s])) / sum(rate(llmgw_ttft_seconds_count[150s]))
    - record: slo:llmgw_latency:error_ratio_rate5m
      expr: 1 - sum(rate(llmgw_ttft_seconds_bucket{le="0.5"}[5m])) / sum(rate(llmgw_ttft_seconds_count[5m]))
    - record: slo:llmgw_latency:error_ratio_rate30m
      expr: 1 - sum(rate(llmgw_ttft_seconds_bucket{le="0.5"}[30m])) / sum(rate(llmgw_ttft_seconds_count[30m]))
  - name: llm-gateway-slo-alerts
    interval: 5s
    rules:
    - alert: LLMGatewayAvailabilityFastBurn
      expr: slo:llmgw_availability:error_ratio_rate5m > 0.072 and slo:llmgw_availability:error_ratio_rate30s > 0.072 and on() sum(rate(llmgw_requests_total[30s])) > 0.5
      labels:
        severity: page
        slo: availability
      annotations:
        summary: availability error budget burning 14.4x too fast (5m and 30s)
        description: '99.5% of chat requests succeed: no 5xx and no stream cut by the backend (4xx are the client''s). Threshold: error ratio > 0.072 over both windows (windows compressed 12x for experiments).'
    - alert: LLMGatewayAvailabilitySlowBurn
      expr: slo:llmgw_availability:error_ratio_rate30m > 0.03 and slo:llmgw_availability:error_ratio_rate150s > 0.03 and on() sum(rate(llmgw_requests_total[150s])) > 0.5
      labels:
        severity: page
        slo: availability
      annotations:
        summary: availability error budget burning 6x too fast (30m and 150s)
        description: '99.5% of chat requests succeed: no 5xx and no stream cut by the backend (4xx are the client''s). Threshold: error ratio > 0.03 over both windows (windows compressed 12x for experiments).'
    - alert: LLMGatewayLatencyFastBurn
      expr: slo:llmgw_latency:error_ratio_rate5m > 0.144 and slo:llmgw_latency:error_ratio_rate30s > 0.144 and on() sum(rate(llmgw_requests_total[30s])) > 0.5
      labels:
        severity: page
        slo: latency
      annotations:
        summary: latency error budget burning 14.4x too fast (5m and 30s)
        description: '99% of chat requests get their first token within 500 ms. Threshold: error ratio > 0.144 over both windows (windows compressed 12x for experiments).'
    - alert: LLMGatewayLatencySlowBurn
      expr: slo:llmgw_latency:error_ratio_rate30m > 0.06 and slo:llmgw_latency:error_ratio_rate150s > 0.06 and on() sum(rate(llmgw_requests_total[150s])) > 0.5
      labels:
        severity: page
        slo: latency
      annotations:
        summary: latency error budget burning 6x too fast (30m and 150s)
        description: '99% of chat requests get their first token within 500 ms. Threshold: error ratio > 0.06 over both windows (windows compressed 12x for experiments).'
  - name: llm-gateway-cause-alerts
    interval: 5s
    rules:
    - alert: LLMGatewayBackendFailing
      expr: sum by (backend) (rate(llmgw_backend_failures_total[1m])) > 0.1
      for: 30s
      labels:
        severity: ticket
      annotations:
        summary: Backend {{ $labels.backend }} is failing requests (the gateway retries elsewhere)
    - alert: LLMGatewayUsageEventsLost
      expr: sum(increase(llmgw_usage_events_total{result=~"failed|dropped"}[5m])) > 0
      labels:
        severity: ticket
      annotations:
        summary: 'Usage events failed or were dropped: those requests will never be billed'
    - alert: LLMGatewayBillingLag
      expr: max(llmgw_meter_consumer_lag) > 500
      for: 1m
      labels:
        severity: ticket
      annotations:
        summary: The meter is {{ $value }} usage records behind (Postgres down or meter slow)
    - alert: LLMGatewayMeterNotReporting
      expr: absent_over_time(llmgw_meter_consumer_lag[1m])
      for: 1m
      labels:
        severity: ticket
      annotations:
        summary: 'No metrics from the meter for a minute: is it running?'
