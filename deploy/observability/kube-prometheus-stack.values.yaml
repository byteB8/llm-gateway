# helm upgrade --install kps prometheus-community/kube-prometheus-stack --version 92.16.1 \
#   -n observability --create-namespace -f deploy/observability/kube-prometheus-stack.values.yaml
fullnameOverride: kps
# kind runs these on localhost inside the node; scraping them only produces "target down" noise.
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}

prometheus:
  service: {type: NodePort, nodePort: 30090}
  prometheusSpec:
    scrapeInterval: 5s        # fast, so alert experiments are short
    evaluationInterval: 5s
    retention: 2d
    enableFeatures: [exemplar-storage]
    # Pick up the PodMonitors and PrometheusRules from this repo, not only the chart's own.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 100m, memory: 400Mi}
      limits: {memory: 1Gi}

grafana:
  adminPassword: admin  # local laptop cluster only
  # Read-only without logging in, so scripts can screenshot dashboards (the port is bound to 127.0.0.1).
  grafana.ini:
    auth.anonymous: {enabled: true, org_role: Viewer}
  service: {type: NodePort, nodePort: 30300}
  sidecar:
    dashboards: {enabled: true, label: grafana_dashboard, labelValue: "1", searchNamespace: ALL}
    datasources:
      # A trace_id exemplar on a Prometheus series links straight to the trace in Tempo.
      exemplarTraceIdDestinations: {datasourceUid: tempo, traceIdLabelName: trace_id, urlDisplayLabel: View trace}
  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.observability.svc:3200  # Tempo 2.x serves its HTTP API on 3200
      access: proxy
      jsonData:
        nodeGraph: {enabled: true}
        serviceMap: {datasourceUid: prometheus}

# This repo's alerts go to alert-sink, which records when each arrived (experiments measure time to
# detect). The chart's own platform alerts, its always-firing Watchdog among them, go nowhere: on a
# laptop kind node some fire for good (clock not synchronised) and would only add noise.
alertmanager:
  service: {type: NodePort, nodePort: 30093}
  config:
    global: {resolve_timeout: 1m}
    route:
      receiver: "null"
      group_by: [alertname]
      group_wait: 0s
      group_interval: 10s
      repeat_interval: 1h
      routes:
        - receiver: alert-sink
          matchers: ['alertname =~ "LLMGateway.+"']
    receivers:
      - name: "null"
      - name: alert-sink
        webhook_configs:
          - url: http://alert-sink.observability.svc:8080/alerts
            send_resolved: true
