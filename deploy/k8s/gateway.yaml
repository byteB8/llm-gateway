apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-tenants
data:
  tenants.json: |
    {"tenants": [
      {"name": "team-search", "keys": ["sk-search-dev"], "limits": {"rpm": 6000, "tpm": 2000000, "max_concurrent": 64}},
      {"name": "team-batch",  "keys": ["sk-batch-dev"],  "limits": {"rpm": 60, "tpm": 50000, "max_concurrent": 4}}
    ]}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector: {matchLabels: {app: gateway}}
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      # SIGTERM -> drain (25 s) must fit inside the grace period, after the preStop pause.
      terminationGracePeriodSeconds: 40
      containers:
        - name: gateway
          image: llm-gateway:dev
          imagePullPolicy: Never
          args:
            - -listen=:8080
            - -backends=fakellm-0=http://fakellm-0.fakellm:9000,fakellm-1=http://fakellm-1.fakellm:9000,fakellm-2=http://fakellm-2.fakellm:9000,fakellm-3=http://fakellm-3.fakellm:9000
            - -policy=prefix-affinity
            - -capacity=8
            - -tenants=/etc/llmgw/tenants.json
            - -kafka-brokers=kafka:9092
            - -drain=25s
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 10
          lifecycle:
            # Keep serving for a moment after the pod is marked terminating, so Services stop
            # sending it new connections before the listener closes. (distroless has no shell,
            # so this uses the built-in sleep action.)
            preStop: {sleep: {seconds: 5}}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts: [{name: tenants, mountPath: /etc/llmgw}]
      volumes:
        - name: tenants
          configMap: {name: gateway-tenants}
