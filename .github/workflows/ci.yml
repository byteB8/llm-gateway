name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Real Postgres and Kafka, so the billing and publishing integration tests run instead of skipping.
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: meter, POSTGRES_PASSWORD: meter-ci, POSTGRES_DB: meter}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U meter" --health-interval 2s --health-retries 30
      kafka:
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-retries 30
    env:
      PG_DSN: postgres://meter:meter-ci@localhost:5432/meter
      KAFKA_BROKERS: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23"}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: integration tests ran (not skipped)
        run: |
          go test -count=1 -v -run 'TestKafkaPublishes|TestReplayedBatchIsNotCountedTwice' ./internal/usage ./internal/meter | tee it.out
          ! grep -q -- '--- SKIP' it.out
      - name: build image
        run: docker build -t llm-gateway:ci .

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml==6.0.3
      - name: generated alert rules and dashboards match their generators
        run: |
          python scripts/slo_rules.py && python scripts/dashboards.py
          git diff --exit-code deploy/observability
      - name: promtool (the version the cluster runs)
        run: |
          curl -sSfL https://github.com/prometheus/prometheus/releases/download/v3.15.1/prometheus-3.15.1.linux-amd64.tar.gz |
            tar xz --strip-components=1 prometheus-3.15.1.linux-amd64/promtool
      - name: alert rule unit tests
        run: python scripts/test_rules.py --promtool ./promtool
